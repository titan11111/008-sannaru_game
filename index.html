<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#070b14">
    <title>鉱物融合ラボ - Gem Alchemist</title>
    <meta property="og:title" content="鉱物融合ラボ - Gem Alchemist">
    <meta property="og:description" content="注入管に元素を入れて鉱物を融合。スマホブラウザで遊べる無料ゲーム。">
    <meta property="og:url" content="https://titan11111.github.io/008-sannaru_game/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="description" content="注入管に元素を入れて鉱物を融合するブラウザゲーム。">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px);
            --safe-r: env(safe-area-inset-right, 0px);
            --lab-cyan: #22d3ee;
            --lab-amber: #fbbf24;
            --lab-magenta: #e879f9;
        }
        *, *::before, *::after {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #070b14;
            color: #e2e8f0;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
            margin: 0;
            padding: 0;
        }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .scrollable { touch-action: pan-y; -webkit-overflow-scrolling: touch; }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* グロー効果アニメーション */
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(34, 211, 238, 0.35)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 28px rgba(232, 121, 249, 0.7)); transform: scale(1.03); }
        }
        .glow-animation { animation: pulse-glow 3s infinite ease-in-out; }

        @keyframes ray-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .ray-bg { animation: ray-rotate 20s linear infinite; }

        @keyframes plasma-swirl {
            0% { transform: rotate(0deg) scale(1); filter: hue-rotate(0deg); }
            50% { transform: rotate(180deg) scale(1.1); filter: hue-rotate(90deg); }
            100% { transform: rotate(360deg) scale(1); filter: hue-rotate(0deg); }
        }
        .plasma-effect {
            animation: plasma-swirl 8s infinite linear;
            transform-origin: center;
        }

        .card-shine { position: relative; overflow: hidden; }
        .card-shine::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent 45%, rgba(255,255,255,0.1) 50%, transparent 55%);
            transform: rotate(30deg);
            transition: all 0.6s ease;
            opacity: 0;
        }
        .card-shine:hover::after {
            opacity: 1;
            transform: rotate(30deg) translate(20%, 20%);
        }

        .mineral-photo {
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.35));
            border-radius: 8px;
            pointer-events: none;
        }

        /* ===== 注入管リアクター ===== */
        .lab-panel {
            background:
                radial-gradient(ellipse at 50% 18%, rgba(34,211,238,0.12), transparent 55%),
                radial-gradient(ellipse at 80% 80%, rgba(168,85,247,0.1), transparent 50%),
                linear-gradient(180deg, #0c1220 0%, #080c16 100%);
            border: 1px solid rgba(51, 65, 85, 0.9);
            box-shadow: inset 0 1px 0 rgba(148,163,184,0.08), 0 20px 50px rgba(0,0,0,0.35);
        }
        .injector-row {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 10px;
            width: 100%;
            max-width: 360px;
            margin: 0 auto 4px;
            position: relative;
            z-index: 20;
        }
        .injector {
            flex: 1;
            min-width: 0;
            min-height: 112px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            padding: 10px 6px 8px;
            border-radius: 16px;
            border: 1.5px solid rgba(100, 116, 139, 0.55);
            background: rgba(15, 23, 42, 0.85);
            cursor: pointer;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            transition: none;
        }
        .injector.filled {
            border-color: rgba(34, 211, 238, 0.65);
            background: rgba(8, 47, 73, 0.55);
        }
        .injector-label {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0;
            white-space: nowrap;
            color: #cbd5e1;
            line-height: 1.2;
        }
        .injector.filled .injector-label { color: #e2e8f0; }
        .injector-glass {
            width: 36px;
            height: 58px;
            border-radius: 10px 10px 6px 6px;
            border: 2px solid rgba(148,163,184,0.55);
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(15,23,42,0.85));
            box-shadow:
                inset 0 0 12px rgba(34,211,238,0.12),
                0 0 0 1px rgba(15,23,42,0.8);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .injector-glass::before {
            content: '';
            position: absolute;
            left: 4px; top: 6px; bottom: 6px;
            width: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.18);
            z-index: 2;
            pointer-events: none;
        }
        .injector-liquid {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 0%;
            transition: height 0.45s cubic-bezier(0.2, 0.9, 0.2, 1), background 0.3s ease, opacity 0.3s ease;
            opacity: 0.92;
            border-radius: 0 0 4px 4px;
        }
        .injector.filled .injector-liquid { height: 72%; }
        .injector.draining .injector-liquid {
            height: 0% !important;
            transition: height 1.2s ease-in;
        }
        .injector-bubbles {
            position: absolute; inset: 0; pointer-events: none; opacity: 0;
        }
        .injector.filled .injector-bubbles { opacity: 1; animation: bubble-rise 1.6s ease-in-out infinite; }
        @keyframes bubble-rise {
            0%, 100% { transform: translateY(4px); opacity: 0.35; }
            50% { transform: translateY(-6px); opacity: 0.8; }
        }
        .injector-nozzle {
            width: 10px; height: 14px;
            background: linear-gradient(180deg, #64748b, #334155);
            border-radius: 0 0 4px 4px;
            margin-top: -1px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .pipe-lines {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 360px;
            height: 20px;
            margin: 0 auto -4px;
            position: relative;
            z-index: 11;
        }
        .pipe {
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .pipe::before {
            content: '';
            width: 4px;
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(180deg, #475569, #1e293b);
        }
        .pipe::after {
            content: '';
            position: absolute;
            left: 50%;
            margin-left: -2px;
            width: 4px;
            top: -100%;
            height: 40%;
            background: linear-gradient(180deg, transparent, var(--flow, #22d3ee), transparent);
            opacity: 0;
        }
        .injector.filled + .pipe-sync .pipe,
        .pipe.flowing::after {
            opacity: 1;
            animation: flow-down 0.9s linear infinite;
        }
        .pipe.flowing::after { opacity: 1; animation: flow-down 0.55s linear infinite; }
        @keyframes flow-down {
            from { top: -40%; }
            to { top: 100%; }
        }
        .slot-box {
            transition: none;
            touch-action: manipulation;
        }
        .slot-box:active { transform: scale(0.94); opacity: 0.9; }
        .mat-card {
            transition: none;
            touch-action: manipulation;
            -webkit-user-select: none;
        }
        .mat-card:active { transform: scale(0.94); opacity: 0.88; }
        .fuse-btn-live {
            background-size: 200% auto;
            animation: fuse-sheen 2.8s linear infinite;
            touch-action: manipulation;
            transition: none;
        }
        @keyframes fuse-sheen {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .chamber-charging {
            filter: drop-shadow(0 0 28px rgba(34,211,238,0.55)) drop-shadow(0 0 48px rgba(168,85,247,0.45));
            transform: scale(1.04);
        }
        #fuse-btn:active:not(:disabled) { transform: scale(0.97); }

        /* 実験室はスクロール禁止・1画面完結 */
        html, body {
            height: 100%;
            overflow: hidden;
        }
        #app-shell {
            height: 100dvh;
            height: 100svh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-t);
            padding-left: var(--safe-l);
            padding-right: var(--safe-r);
        }
        #app-shell > main {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            padding: 8px 12px calc(8px + var(--safe-b));
        }
        #lab-view {
            height: 100%;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #lab-view.hidden { display: none !important; }
        #collection-view {
            height: 100%;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }
        .lab-panel {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .injector:active { transform: scale(0.96); opacity: 0.92; }
        .injector.picking {
            border-color: #22d3ee !important;
            box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.35);
            background: rgba(8, 47, 73, 0.75) !important;
        }
        .injector-hint {
            font-size: 9px;
            color: #64748b;
            white-space: nowrap;
            line-height: 1;
        }
        .injector.filled .injector-hint { color: #67e8f9; }

        /* 元素選択オーバーレイ（下から出るシート） */
        .mat-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
        }
        .mat-overlay.open {
            pointer-events: auto;
            opacity: 1;
            visibility: visible;
        }
        .mat-overlay-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 23, 0.75);
            touch-action: manipulation;
        }
        .mat-overlay-sheet {
            position: relative;
            width: 100%;
            max-width: 430px;
            max-height: min(72dvh, 560px);
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            background: #0b1220;
            border: 1px solid #334155;
            border-bottom: none;
            border-radius: 22px 22px 0 0;
            padding: 12px 14px calc(16px + var(--safe-b));
            box-shadow: 0 -16px 48px rgba(0,0,0,0.55);
            transform: translateY(100%);
            transition: transform 0.22s ease-out;
        }
        .mat-overlay.open .mat-overlay-sheet {
            transform: translateY(0);
        }
        .mat-overlay-handle {
            width: 40px;
            height: 4px;
            border-radius: 999px;
            background: #475569;
            margin: 0 auto 10px;
        }
        .mat-overlay-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .mat-overlay-grid .mat-card {
            min-height: 76px;
            min-width: 0;
            padding: 8px 4px;
            border-radius: 14px;
            background: #020617;
            border: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            touch-action: manipulation;
        }
        .mat-overlay-grid .mat-card .mat-name {
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
            color: #e2e8f0;
        }
        .tab-btn {
            touch-action: manipulation;
            transition: none !important;
        }
        .tab-btn:active { opacity: 0.85; transform: scale(0.96); }
        .fast-tap { touch-action: manipulation; }

        @media (max-width: 640px) {
            .injector { min-height: 108px; }
            .injector-glass { width: 34px; height: 52px; }
            .pipe-lines { height: 16px; }
            #chamber-ring { width: 10.5rem !important; height: 10.5rem !important; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
<div id="app-shell">

    <!-- ヘッダーエリア -->
    <header class="border-b border-slate-800 bg-slate-900/90 shrink-0 z-30 px-3 py-2 flex justify-between items-center">
        <div class="flex items-center space-x-2 min-w-0">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-600 to-fuchsia-500 flex items-center justify-center text-white shrink-0">
                <i class="fa-solid fa-vial-virus"></i>
            </div>
            <div class="min-w-0">
                <h1 class="text-base font-bold font-cinzel tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-fuchsia-300 to-indigo-300 truncate">GEM ALCHEMIST</h1>
                <p class="text-[10px] text-slate-400">鉱物融合ラボ</p>
            </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
            <button type="button" id="mute-btn" class="tab-btn w-9 h-9 rounded-lg border border-slate-700 text-sm" aria-label="ミュート切替" aria-pressed="false">🔊</button>
            <nav class="flex bg-slate-800/90 p-0.5 rounded-xl border border-slate-700/50">
                <button type="button" id="tab-lab-btn" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-cyan-600 text-white shadow-md">
                    実験室
                </button>
                <button type="button" id="tab-collection-btn" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 flex items-center gap-1">
                    図鑑
                    <span id="badge-count" class="bg-slate-900 text-cyan-300 text-[10px] px-1.5 py-0.5 rounded-full border border-cyan-500/30">0</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="w-full max-w-lg mx-auto">

        <!-- ===== 実験室 View ===== -->
        <section id="lab-view">
            <div class="lab-panel rounded-2xl p-3 relative">
                <canvas id="bg-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

                <div class="z-10 text-center mb-1 shrink-0">
                    <div class="inline-flex items-center gap-1.5 text-[9px] font-semibold tracking-[0.18em] text-cyan-300 uppercase bg-cyan-950/50 px-2.5 py-0.5 rounded-full border border-cyan-700/40">
                        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                        LAB ONLINE
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1">注入管A〜Cをタップ → 元素を選ぶ</p>
                </div>

                <div class="z-10 relative flex flex-col items-center justify-center flex-1 min-h-0 w-full">
                    <!-- 注入管 A/B/C（タップで元素オーバーレイ） -->
                    <div class="injector-row">
                        <button type="button" class="injector" id="injector-0" aria-label="注入管 A" onclick="openMaterialOverlay(0)">
                            <div class="injector-label">注入管 A</div>
                            <div class="injector-glass">
                                <div class="injector-liquid" id="liquid-0"></div>
                                <div class="injector-bubbles text-center text-[9px] text-white/80 pt-5" id="bubble-0"></div>
                            </div>
                            <div class="injector-nozzle"></div>
                            <div class="injector-hint" id="hint-0">タップで注入</div>
                        </button>
                        <button type="button" class="injector" id="injector-1" aria-label="注入管 B" onclick="openMaterialOverlay(1)">
                            <div class="injector-label">注入管 B</div>
                            <div class="injector-glass">
                                <div class="injector-liquid" id="liquid-1"></div>
                                <div class="injector-bubbles text-center text-[9px] text-white/80 pt-5" id="bubble-1"></div>
                            </div>
                            <div class="injector-nozzle"></div>
                            <div class="injector-hint" id="hint-1">タップで注入</div>
                        </button>
                        <button type="button" class="injector" id="injector-2" aria-label="注入管 C" onclick="openMaterialOverlay(2)">
                            <div class="injector-label">注入管 C</div>
                            <div class="injector-glass">
                                <div class="injector-liquid" id="liquid-2"></div>
                                <div class="injector-bubbles text-center text-[9px] text-white/80 pt-5" id="bubble-2"></div>
                            </div>
                            <div class="injector-nozzle"></div>
                            <div class="injector-hint" id="hint-2">タップで注入</div>
                        </button>
                    </div>
                    <div class="pipe-lines" aria-hidden="true">
                        <div class="pipe" id="pipe-0" style="--flow:#a855f7"></div>
                        <div class="pipe" id="pipe-1" style="--flow:#22d3ee"></div>
                        <div class="pipe" id="pipe-2" style="--flow:#fbbf24"></div>
                    </div>

                    <div id="chamber-ring" class="relative w-56 h-56 sm:w-64 sm:h-64 flex items-center justify-center transition-all duration-500 shrink-0">
                        <svg class="absolute inset-0 w-full h-full drop-shadow-[0_0_20px_rgba(34,211,238,0.25)]" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="150" cy="150" r="135" stroke="#334155" stroke-width="4" stroke-dasharray="10 6" />
                            <circle cx="150" cy="150" r="120" stroke="#475569" stroke-width="2" />
                            <path d="M 70 55 L 110 105" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
                            <path d="M 70 55 L 110 105" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4 4" class="animate-pulse"/>
                            <path d="M 150 40 L 150 100" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
                            <path d="M 150 40 L 150 100" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="4 4" class="animate-pulse"/>
                            <path d="M 230 55 L 190 105" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
                            <path d="M 230 55 L 190 105" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4 4" class="animate-pulse"/>
                            <circle cx="150" cy="150" r="65" fill="url(#crucibleGrad)" stroke="#22d3ee" stroke-width="3" />
                            <g class="plasma-effect opacity-70">
                                <path d="M120 150 C120 120, 180 120, 180 150 C180 180, 120 180, 120 150 Z" fill="url(#plasmaGrad)" />
                                <circle cx="135" cy="140" r="15" fill="#f43f5e" opacity="0.6" />
                                <circle cx="165" cy="160" r="18" fill="#3b82f6" opacity="0.6" />
                            </g>
                            <circle cx="150" cy="150" r="65" fill="url(#glassShine)" opacity="0.4" />
                            <circle cx="150" cy="150" r="70" stroke="#a855f7" stroke-width="2" stroke-dasharray="40 10" />
                            <path d="M 90 150 A 60 60 0 0 1 210 150" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 6" fill="none" />
                            <defs>
                                <radialGradient id="crucibleGrad" cx="50%" cy="50%" r="50%">
                                    <stop offset="0%" stop-color="#0f2740" />
                                    <stop offset="70%" stop-color="#0f172a" />
                                    <stop offset="100%" stop-color="#020617" />
                                </radialGradient>
                                <radialGradient id="plasmaGrad" cx="50%" cy="50%" r="50%">
                                    <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9" />
                                    <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
                                    <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
                                </radialGradient>
                                <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
                                    <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05" />
                                    <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
                                </linearGradient>
                            </defs>
                        </svg>
                        <div id="chamber-status" class="absolute bottom-2 text-[10px] tracking-widest font-cinzel text-cyan-400/80">STANDBY</div>
                    </div>

                    <div class="flex items-center gap-3 mt-2 mb-2 shrink-0">
                        <button type="button" id="clear-all-btn" class="fast-tap text-[11px] text-slate-400 px-2 py-1">クリア</button>
                        <button type="button" id="autofill-btn" class="fast-tap text-[11px] text-cyan-400 px-2 py-1">おまかせ</button>
                    </div>

                    <button type="button" id="fuse-btn" class="fuse-btn-live w-full max-w-sm py-3.5 px-4 rounded-2xl font-bold font-cinzel text-base tracking-wider bg-gradient-to-r from-cyan-600 via-fuchsia-600 to-cyan-600 bg-[length:200%_auto] text-white shadow-xl shadow-cyan-900/40 disabled:opacity-40 disabled:cursor-not-allowed disabled:animate-none flex items-center justify-center gap-2 shrink-0">
                        <i class="fa-solid fa-bolt text-yellow-300"></i>
                        <span>FUSE / 融合実行</span>
                    </button>
                </div>
            </div>
        </section>

                    <polygon points="50,8 76,28 76,72 50,92 24,72 24,28" fill="url(#${uid}_g30)" stroke="#ffffff" stroke-width="2"/>
                    <polygon points="50,8 63,28 50,42 37,28" fill="#ffffff" opacity="0.9"/>
                    <line x1="50" y1="8" x2="50" y2="92" stroke="#e2e8f0" stroke-width="1.5"/>
                `,

                fail: `

                    <path d="M 30,25 L 48,52 L 18,62" fill="#334155"/>

        let selectedSlots = [null, null, null];

        function loadProgress() {

        function updateSlotUI() {

        /* ====================================================================
           6. 融合ロジック ＆ アニメーション演出
           ==================================================================== */

        function startSynthesis() {
            if (isSynthesizing) return;
            
            const activeMats = selectedSlots.filter(s => s !== null);
            if (activeMats.length < 2) return;

            isSynthesizing = true;
            const fuseBtn = document.getElementById('fuse-btn');
            fuseBtn.disabled = true;

            playSound('charge');
            triggerChamberChargeEffect(true);

            setTimeout(() => {
                triggerChamberChargeEffect(false);
                executeFusion(activeMats);
                isSynthesizing = false;
                fuseBtn.disabled = false;
            }, 1800);
        }

        function executeFusion(mats) {
            const sortedIds = mats.map(m => m.id).sort().join(',');
            const resultId = RECIPES[sortedIds];

            let resultMineral = MINERALS.find(m => m.id === resultId);
            let isNew = false;

            if (!resultMineral) {
                resultMineral = FAILED_MINERAL;
            } else {
                if (!discoveredSet.has(resultMineral.id)) {
                    discoveredSet.add(resultMineral.id);
                    saveProgress();
                    isNew = true;
                }
            }

            spawnExplosionParticles();
            // SEはここで1回だけ（モーダル側では鳴らさない＝二重防止）
            if (resultMineral.id === 'fail') {
                playSound('fail');
            } else if (isNew) {
                playSound('discovery');
            } else {
                playSound('success');
            }

            setTimeout(() => {
                showResultModal(resultMineral, isNew);
            }, 200);
        }

        /* ====================================================================
           8. Canvas パーティクル ＆ エフェクト
           ==================================================================== */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            if (canvas.parentElement) {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color, speed, size) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.size = Math.random() * size + 1;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.008;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function triggerChamberChargeEffect(active) {
            const ring = document.getElementById('chamber-ring');
            const status = document.getElementById('chamber-status');
            if (active) {
                ring.classList.add('chamber-charging');
                if (status) status.textContent = 'INJECTING…';
                selectedSlots.forEach((mat, idx) => {
                    if (!mat) return;
                    const injector = document.getElementById(`injector-${idx}`);
                    const pipe = document.getElementById(`pipe-${idx}`);
                    if (injector) injector.classList.add('draining');
                    if (pipe) pipe.classList.add('flowing');
                });
                const interval = setInterval(() => {
                    if (!isSynthesizing) {
                        clearInterval(interval);
                        return;
                    }
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;
                    for (let i = 0; i < 4; i++) {
                        particles.push(new Particle(centerX, centerY, '#67e8f9', 6, 4));
                        particles.push(new Particle(centerX, centerY, '#c084fc', 5, 3));
                    }
                }, 50);
            } else {
                ring.classList.remove('chamber-charging');
                if (status) status.textContent = 'SYNTHESIS';
                [0, 1, 2].forEach(idx => {
                    const pipe = document.getElementById(`pipe-${idx}`);
                    if (pipe) pipe.classList.remove('flowing');
                });
            }
        }

        function spawnExplosionParticles() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const colors = ['#a855f7', '#ec4899', '#3b82f6', '#f59e0b', '#ffffff'];

            for (let i = 0; i < 120; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(centerX, centerY, color, 14, 5));
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();


        /* ====================================================================
           9. サウンド（BGM=ishi-moment-long / 発見・失敗テーマ＋SE）
           ==================================================================== */
        const MUTE_KEY = 'gem_alchemist_muted';
        const AudioCtx = window.AudioContext || window.webkitAudioContext;

        const SoundBus = {
            unlocked: false,
            muted: localStorage.getItem(MUTE_KEY) === '1',
            ctx: null,
            bgm: null,       // 待機・合成共通: ishi-moment-long
            theme: null,     // 新発見: ishi-moment
            failTheme: null, // 失敗（不純）: maou
            se: {},
            chargeOsc: null,
            chargeGain: null,

            init() {
                // field.m4a は不採用。待機中も合成中も同じBGM
                this.bgm = new Audio('audio/ishi-moment-long.m4a');
                this.bgm.loop = true;
                this.bgm.preload = 'auto';
                this.bgm.volume = 0.16;

                this.theme = new Audio('audio/ishi-moment.m4a');
                this.theme.loop = false;
                this.theme.preload = 'none';
                this.theme.volume = 0.22;

                this.failTheme = new Audio('audio/maou.m4a');
                this.failTheme.loop = true;
                this.failTheme.preload = 'auto';
                this.failTheme.volume = 0.18;

                this.se = {
                    ok: new Audio('audio/seikai2.m4a'),
                    ng: new Audio('audio/fuseikai2.m4a'),
                    level: new Audio('audio/levelup.m4a')
                };
                Object.values(this.se).forEach((a) => {
                    a.preload = 'auto';
                    a.volume = 0.36;
                });
                this.syncMuteUi();
            },

            ensureCtx() {
                if (!this.ctx) this.ctx = new AudioCtx();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                return this.ctx;
            },

            unlock() {
                if (this.unlocked) {
                    this.ensureCtx();
                    return;
                }
                this.unlocked = true;
                this.ensureCtx();
                // iOS: 無音再生で解錠
                const silent = this.bgm;
                const prev = silent.volume;
                silent.volume = 0;
                const p = silent.play();
                if (p && p.then) {
                    p.then(() => {
                        silent.pause();
                        silent.currentTime = 0;
                        silent.volume = prev;
                        if (!this.muted) this.startBgm();
                    }).catch(() => {
                        silent.volume = prev;
                    });
                } else if (!this.muted) {
                    silent.volume = prev;
                    this.startBgm();
                }
            },

            syncMuteUi() {
                const btn = document.getElementById('mute-btn');
                if (!btn) return;
                btn.textContent = this.muted ? '🔇' : '🔊';
                btn.setAttribute('aria-pressed', this.muted ? 'true' : 'false');
            },

            toggleMute() {
                this.muted = !this.muted;
                localStorage.setItem(MUTE_KEY, this.muted ? '1' : '0');
                this.syncMuteUi();
                if (this.muted) {
                    this.stopAll();
                } else if (this.unlocked) {
                    this.startBgm();
                }
            },

            isPlaying(a) {
                return !!(a && !a.paused && a.currentTime > 0);
            },

            stopSeAll() {
                Object.values(this.se).forEach((a) => {
                    try {
                        a.pause();
                        a.currentTime = 0;
                    } catch (e) { /* ignore */ }
                });
            },

            stopTheme() {
                if (!this.theme) return;
                try {
                    this.theme.pause();
                    this.theme.currentTime = 0;
                } catch (e) { /* ignore */ }
            },

            stopFailTheme() {
                if (!this.failTheme) return;
                try {
                    this.failTheme.pause();
                    this.failTheme.currentTime = 0;
                } catch (e) { /* ignore */ }
            },

            stopCharge() {
                try {
                    if (this.chargeOsc) {
                        this.chargeOsc.stop();
                        this.chargeOsc.disconnect();
                    }
                } catch (e) { /* ignore */ }
                this.chargeOsc = null;
                this.chargeGain = null;
            },

            stopAll() {
                this.stopCharge();
                this.stopSeAll();
                this.stopTheme();
                this.stopFailTheme();
                if (this.bgm) {
                    try {
                        this.bgm.pause();
                    } catch (e) { /* ignore */ }
                }
            },

            startBgm() {
                if (!this.unlocked || this.muted || !this.bgm) return;
                // 発見・失敗テーマ中はBGMを重ねない
                if (this.isPlaying(this.theme) || this.isPlaying(this.failTheme)) return;
                if (!this.bgm.paused) return;
                this.bgm.play().catch(() => {});
            },

            pauseBgm() {
                if (!this.bgm) return;
                try { this.bgm.pause(); } catch (e) { /* ignore */ }
            },

            /** 同一SEの二重再生防止：止めてから頭出し再生 */
            playSe(key) {
                if (!this.unlocked || this.muted) return;
                const a = this.se[key];
                if (!a) return;
                this.stopSeAll();
                try {
                    a.currentTime = 0;
                    a.play().catch(() => {});
                } catch (e) { /* ignore */ }
            },

            /** 新発見テーマ：BGM停止→ishi-moment */
            playDiscoveryTheme() {
                if (!this.unlocked || this.muted) return;
                this.stopCharge();
                this.stopSeAll();
                this.stopFailTheme();
                this.pauseBgm();
                this.stopTheme();
                try {
                    this.theme.currentTime = 0;
                    this.theme.play().catch(() => {
                        this.playSe('level');
                        this.startBgm();
                    });
                } catch (e) {
                    this.playSe('level');
                    this.startBgm();
                }
            },

            /** 失敗テーマ：BGM停止→maou（不純な金属） */
            playFailTheme() {
                if (!this.unlocked || this.muted) return;
                this.stopCharge();
                this.stopSeAll();
                this.stopTheme();
                this.pauseBgm();
                this.stopFailTheme();
                try {
                    this.failTheme.currentTime = 0;
                    this.failTheme.play().catch(() => {
                        this.playSe('ng');
                        this.startBgm();
                    });
                } catch (e) {
                    this.playSe('ng');
                    this.startBgm();
                }
            },

            endResultThemes() {
                this.stopTheme();
                this.stopFailTheme();
                if (!this.muted && this.unlocked) this.startBgm();
            },

            endDiscoveryTheme() {
                this.endResultThemes();
            },

            softPauseAllMusic() {
                [this.bgm, this.theme, this.failTheme].forEach((a) => {
                    if (!a) return;
                    try { a.pause(); } catch (e) { /* ignore */ }
                });
                this.stopCharge();
            },

            softResumeMusic() {
                if (!this.unlocked || this.muted) return;
                const resume = (a) => {
                    if (a && a.paused && a.currentTime > 0.05) {
                        a.play().catch(() => {});
                        return true;
                    }
                    return false;
                };
                if (resume(this.theme) || resume(this.failTheme)) return;
                this.startBgm();
            },

            beep(type) {
                if (!this.unlocked || this.muted) return;
                try {
                    const ctx = this.ensureCtx();
                    const now = ctx.currentTime;
                    if (type === 'select') {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(520, now);
                        osc.frequency.exponentialRampToValueAtTime(880, now + 0.07);
                        gain.gain.setValueAtTime(0.04, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                        osc.start(now);
                        osc.stop(now + 0.08);
                    } else if (type === 'clear') {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(280, now);
                        osc.frequency.linearRampToValueAtTime(140, now + 0.09);
                        gain.gain.setValueAtTime(0.04, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.09);
                        osc.start(now);
                        osc.stop(now + 0.1);
                    } else if (type === 'charge') {
                        this.stopCharge();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(140, now);
                        osc.frequency.exponentialRampToValueAtTime(720, now + 1.5);
                        gain.gain.setValueAtTime(0.01, now);
                        gain.gain.linearRampToValueAtTime(0.05, now + 1.5);
                        osc.start(now);
                        osc.stop(now + 1.55);
                        this.chargeOsc = osc;
                        this.chargeGain = gain;
                    } else if (type === 'error') {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'square';
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(160, now);
                        gain.gain.setValueAtTime(0.025, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.12);
                        osc.start(now);
                        osc.stop(now + 0.12);
                    }
                } catch (e) { /* ignore */ }
            }
        };

        function playSound(type) {
            SoundBus.unlock();
            if (type === 'select' || type === 'clear' || type === 'charge' || type === 'error') {
                SoundBus.beep(type);
                return;
            }
            if (type === 'fail') {
                SoundBus.playFailTheme();
                return;
            }
            if (type === 'success') {
                SoundBus.stopCharge();
                SoundBus.playSe('ok');
                SoundBus.startBgm();
                return;
            }
            if (type === 'discovery') {
                SoundBus.playDiscoveryTheme();
                return;
            }
        }

        function initAudio() {
            SoundBus.unlock();
        }


        /* ====================================================================
           10. 初期化処理
           ==================================================================== */
        window.onload = function() {
            SoundBus.init();
            renderMaterials();
            updateSlotUI();
            loadProgress();
            resizeCanvas();

            bindFastTap(document.getElementById('tab-lab-btn'), () => switchTab('lab'));
            bindFastTap(document.getElementById('tab-collection-btn'), () => switchTab('collection'));
            bindFastTap(document.getElementById('fuse-btn'), () => startSynthesis());
            bindFastTap(document.getElementById('clear-all-btn'), () => clearAllSlots());
            bindFastTap(document.getElementById('autofill-btn'), () => autoFillRandom());
            bindFastTap(document.getElementById('reset-btn'), () => resetGameData());
            bindFastTap(document.getElementById('mute-btn'), () => {
                SoundBus.unlock();
                SoundBus.toggleMute();
            });

            document.getElementById('rarity-filter').addEventListener('change', () => renderCollection());

            // 最初のタップでBGM解錠
            const unlockOnce = () => {
                SoundBus.unlock();
                document.removeEventListener('pointerdown', unlockOnce);
            };
            document.addEventListener('pointerdown', unlockOnce, { passive: true });
        };

        // iOS: ダブルタップズーム防止（スクロール領域は除外）
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                if (!e.target.closest('#collection-view, select, input, textarea, .mat-overlay-sheet, .injector, .mat-card, button')) {
                    e.preventDefault();
                }
            }
            lastTouchEnd = now;
        }, { passive: false });

        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('selectstart', (e) => {
            if (!e.target.closest('input, textarea, select')) e.preventDefault();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                SoundBus.softPauseAllMusic();
            } else {
                SoundBus.softResumeMusic();
            }
        });

    </script>
</body>
</html>
